<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 64" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#C59B27"/>
      <stop offset="75%" stop-color="#A67C1E"/>
      <stop offset="100%" stop-color="#7B5B11"/>
    </linearGradient>
    <linearGradient id="crestGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2319"/>
      <stop offset="100%" stop-color="#05120C"/>
    </linearGradient>
  </defs>

  <!-- Bold Crest Emblem -->
  <g transform="translate(2, 2)">
    <polygon points="30,1 55,10 60,32 50,53 30,59 10,53 0,32 5,10" fill="url(#crestGradDark)" stroke="url(#goldGradDark)" stroke-width="2.2" />
    <polygon points="30,5 50,13 54,31 46,49 30,54 14,49 6,31 10,13" fill="none" stroke="url(#goldGradDark)" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,2" />
    
    <path d="M15,18 L30,47 L45,18 L38,18 L30,36 L22,18 Z" fill="url(#goldGradDark)"/>
    
    <polygon points="30,8 33,16 30,23 27,16" fill="url(#goldGradDark)" />
    <circle cx="30,12" r="1.8" fill="#FFFFFF" />
    
    <line x1="18" y1="51" x2="42" y2="51" stroke="url(#goldGradDark)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- High-Visibility Large Brand Typography -->
  <g transform="translate(74, 44)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="2.5" fill="#0E2319">VIDIT</text>
    <text x="116" y="0" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="2.5" fill="url(#goldGradDark)">SIGNATURE</text>
  </g>
</svg>
