<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 85" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="35%" stop-color="#DFB76C"/>
      <stop offset="75%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9A7311"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3B2F"/>
      <stop offset="100%" stop-color="#0A1813"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(6, 6)">
    <!-- Octagon / Diamond Luxury Shield Outer -->
    <polygon points="36,2 64,13 71,38 58,64 36,71 14,64 1,38 8,13" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="36,6 59,15 65,37 54,60 36,65 18,60 7,37 13,15" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2,2" />
    
    <!-- Stylized Architectural 'V' -->
    <path d="M19,22 L36,56 L53,22 L45,22 L36,44 L27,22 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Central Signature Spire Pinnacle -->
    <polygon points="36,11 39,20 36,28 33,20" fill="url(#goldGrad)" />
    <circle cx="36,15" r="1.8" fill="#FFF" />
    
    <!-- Base Bar -->
    <line x1="23" y1="61" x2="49" y2="61" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Clean Typography -->
  <g transform="translate(94, 18)">
    <text x="0" y="34" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="3" fill="#FFFFFF">VIDIT</text>
    <text x="116" y="34" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="3" fill="url(#goldGrad)">SIGNATURE</text>
    <text x="2" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="5" fill="#DFB76C">JABALPUR</text>
  </g>
</svg>
