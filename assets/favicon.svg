<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2B8"/>
      <stop offset="35%" stop-color="#DFB76C"/>
      <stop offset="75%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6A0F"/>
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2319"/>
      <stop offset="100%" stop-color="#05120C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded octagon / shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="4"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="url(#favGold)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3,3"/>

  <!-- Stylized Architectural 'V' -->
  <path d="M34,42 L64,100 L94,42 L80,42 L64,78 L48,42 Z" fill="url(#favGold)"/>
  
  <!-- Peak Pinnacle Star/Beacon -->
  <polygon points="64,22 69,36 64,46 59,36" fill="url(#favGold)"/>
  <circle cx="64,28" r="3" fill="#FFFFFF"/>
</svg>
